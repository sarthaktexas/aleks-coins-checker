name: ALEKS daily sync

on:
  schedule:
    # 12:00 UTC ≈ 7:00 AM Central (CST) / 6:00 AM CDT
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Exam period key (empty = today in range, else nearest past period)"
        required: false
        default: ""
        type: string
      force:
        description: "Force sync even if period has ended / not started"
        required: false
        default: false
        type: boolean

concurrency:
  group: aleks-daily-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/aleks-sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/aleks-sync/package-lock.json

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/aleks-sync/package-lock.json') }}

      - name: Install sync dependencies
        working-directory: scripts/aleks-sync
        run: |
          npm install
          npx playwright install chromium

      - name: Run ALEKS sync
        working-directory: scripts/aleks-sync
        env:
          ALEKS_USERNAME: ${{ secrets.ALEKS_USERNAME }}
          ALEKS_PASSWORD: ${{ secrets.ALEKS_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
          IMPORT_API_TOKEN: ${{ secrets.IMPORT_API_TOKEN }}
          EXAM_PERIOD: ${{ inputs.period }}
          FORCE_SYNC: ${{ inputs.force == true && '1' || '0' }}
        run: npm run sync

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aleks-sync-debug
          path: scripts/aleks-sync/.downloads/
          if-no-files-found: ignore
          retention-days: 7
