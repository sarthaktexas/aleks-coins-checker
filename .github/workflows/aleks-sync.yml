name: ALEKS daily sync

on:
  schedule:
    # 12:00 UTC ≈ 7:00 AM Central (CST) / 6:00 AM CDT
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/aleks-sync/package-lock.json

      - name: Install sync dependencies
        working-directory: scripts/aleks-sync
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run ALEKS sync
        working-directory: scripts/aleks-sync
        env:
          ALEKS_USERNAME: ${{ secrets.ALEKS_USERNAME }}
          ALEKS_PASSWORD: ${{ secrets.ALEKS_PASSWORD }}
          ALEKS_CLASSES: ${{ secrets.ALEKS_CLASSES }}
          APP_URL: ${{ secrets.APP_URL }}
          IMPORT_API_TOKEN: ${{ secrets.IMPORT_API_TOKEN }}
          EXAM_PERIOD: ${{ secrets.EXAM_PERIOD }}
        run: npm run sync

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aleks-sync-debug
          path: scripts/aleks-sync/.downloads/
          if-no-files-found: ignore
          retention-days: 7
