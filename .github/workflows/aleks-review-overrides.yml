name: ALEKS review overrides

on:
  schedule:
    # 13:00 UTC ≈ 8:00 AM Central — after the Excel sync cron
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  verify-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/aleks-sync/package-lock.json

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/aleks-sync/package-lock.json') }}

      - name: Install sync dependencies
        working-directory: scripts/aleks-sync
        run: |
          npm install
          npx playwright install chromium

      - name: Verify reviewed-topics overrides
        working-directory: scripts/aleks-sync
        env:
          ALEKS_USERNAME: ${{ secrets.ALEKS_USERNAME }}
          ALEKS_PASSWORD: ${{ secrets.ALEKS_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
          IMPORT_API_TOKEN: ${{ secrets.IMPORT_API_TOKEN }}
        run: npm run verify-reviews

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aleks-review-verify-debug
          path: scripts/aleks-sync/.downloads-reviews/
          if-no-files-found: ignore
          retention-days: 7
